name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.tag.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: test -n "${{ steps.ver.outputs.version }}"
      - id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tag.outputs.exists == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Wavvon/Wavvon-server
          ref: 78ff4aab3ba905ef4480d02d47f24d63762cc697
          path: wavvon-server
          sparse-checkout: crates/identity/wire-vectors.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - if: steps.tag.outputs.exists == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - if: steps.tag.outputs.exists == 'false'
        run: npm ci
      - if: steps.tag.outputs.exists == 'false'
        run: npm run check
        env:
          CI: "true"
          WAVVON_WIRE_VECTORS: wavvon-server/crates/identity/wire-vectors.json
      - if: steps.tag.outputs.exists == 'false'
        run: mkdir pkg && npm pack --ignore-scripts --pack-destination pkg
      - if: steps.tag.outputs.exists == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg
          path: pkg/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g --ignore-scripts npm@12.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pkg
          path: pkg/
      - run: |
          if npm view "@wavvon/sdk@${{ needs.build.outputs.version }}" version >/dev/null 2>&1; then
            echo "@wavvon/sdk@${{ needs.build.outputs.version }} is already on npm"
          else
            npm stage publish ./pkg/*.tgz --provenance
          fi

  tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.build.outputs.version }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$VERSION" -f sha="${{ github.sha }}"
          gh release create "$VERSION" --repo "${{ github.repository }}" --target "${{ github.sha }}" --generate-notes --title "$VERSION"
